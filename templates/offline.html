<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오프라인 — 계산서 시스템</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Malgun Gothic', Arial, sans-serif;
  background: #111;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
}
.icon { font-size: 64px; margin-bottom: 24px; }
h1 { font-size: 24px; font-weight: 700; letter-spacing: 4px; margin-bottom: 12px; }
p { font-size: 14px; color: #888; line-height: 1.8; margin-bottom: 32px; }
a {
  display: inline-block;
  padding: 12px 32px;
  background: #fff;
  color: #111;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  text-decoration: none;
}
a:hover { background: #ddd; }
</style>
</head>
<body>
  <div class="icon">📋</div>
  <h1>오 프 라 인</h1>
  <p>인터넷 연결이 없습니다.<br>연결을 확인한 후 다시 시도해 주세요.</p>
  <a href="/">홈으로 돌아가기</a>
</body>
</html>
