<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>계산서 - {{ invoice.buyer.name }}</title>
<meta name="robots" content="noindex">
<style>
  @page { size: A4; margin: 0; }
</style>
{% include "_paper_css.html" %}
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #e8e8e8;
  display: flex;
  justify-content: center;
  padding: 30px;
  font-family: 'Malgun Gothic', '맑은 고딕', Arial, sans-serif;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.page { border: 1px solid #999; }

.print-controls {
  position: fixed; top: 20px; right: 20px; display: flex; gap: 8px;
}
.print-controls button, .print-controls a {
  background: #000; color: #fff; border: none; padding: 10px 20px;
  font-size: 13px; font-family: inherit; font-weight: 700;
  cursor: pointer; letter-spacing: 1px; text-decoration: none;
  display: inline-block; border-radius: 4px;
}
.print-controls a { background: #555; }
.print-controls a:hover { background: #333; }

@media print {
  body { background: #fff; padding: 0; margin: 0; display: block; }
  .page { border: none; }
  .grid tr { page-break-inside: avoid; }
  .grid thead { display: table-header-group; }
  .print-controls { display: none; }
}
</style>
</head>
<body>

<div class="print-controls">
  <a href="{% url 'invoice_edit' invoice.pk %}">← 수정</a>
  <button onclick="window.print()">🖨 인쇄</button>
</div>

{% include "_paper.html" %}

</body>
</html>
