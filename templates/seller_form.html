{% extends 'base.html' %}
{% block title %}{% if seller %}판매자 수정{% else %}판매자 추가{% endif %}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{% if seller %}판 매 자 수 정{% else %}판 매 자 추 가{% endif %}</h1>
  <a href="{% url 'settings' %}" class="btn btn-outline">← 뒤로</a>
</div>
<div class="card" style="max-width:540px;">
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>상호명</label>
      <input type="text" name="company_name" value="{{ seller.company_name|default:'' }}" required placeholder="예) 동해먹태">
    </div>
    <div class="form-group">
      <label>주소</label>
      <input type="text" name="address" value="{{ seller.address|default:'' }}" placeholder="예) 강원도 고성군 거진읍...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>전화번호</label>
        <input type="text" name="phone" value="{{ seller.phone|default:'' }}" placeholder="010-0000-0000">
      </div>
      <div class="form-group">
        <label>FAX</label>
        <input type="text" name="fax" value="{{ seller.fax|default:'' }}" placeholder="선택사항">
      </div>
    </div>
    <div class="form-group">
      <label>계좌번호</label>
      <input type="text" name="bank_account" value="{{ seller.bank_account|default:'' }}" placeholder="예) 농협 301-0386-7593-71 홍길동">
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;margin-bottom:20px;">
      <input type="checkbox" name="is_default" {% if seller.is_default %}checked{% endif %}> 기본 판매자로 설정
    </label>
    <div style="display:flex;justify-content:flex-end;gap:10px;">
      <a href="{% url 'settings' %}" class="btn btn-outline">취소</a>
      <button type="submit" class="btn btn-black">저 장</button>
    </div>
  </form>
</div>
{% endblock %}
