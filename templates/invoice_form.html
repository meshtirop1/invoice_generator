{% extends 'base.html' %}
{% block title %}새 계산서{% endblock %}

{% block content %}
<div class="page-header">
  <h1>새 계 산 서</h1>
  <a href="{% url 'dashboard' %}" class="btn btn-outline">← 뒤로</a>
</div>

<form method="post" id="invoiceForm">
{% csrf_token %}

<div class="card">
  <div class="form-row">
    <div class="form-group">
      <label>판매자 선택</label>
      <select name="seller" required>
        {% for seller in sellers %}
        <option value="{{ seller.pk }}" {% if seller == default_seller %}selected{% endif %}>
          {{ seller.company_name }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>날짜</label>
      <input type="date" name="date" value="{% now 'Y-m-d' %}" required>
    </div>
  </div>

  <div class="form-group">
    <label>거래처 (귀하)</label>
    <select name="buyer" id="buyerSelect" required>
      <option value="">-- 거래처 선택 --</option>
      {% for buyer in buyers %}
      <option value="{{ buyer.pk }}"
        data-delivery="{{ buyer.has_delivery_fee|yesno:'true,false' }}"
        data-deduction="{{ buyer.has_deduction|yesno:'true,false' }}"
        {% if request.GET.buyer == buyer.pk|stringformat:"s" %}selected{% endif %}>
        {{ buyer.name }}
      </option>
      {% endfor %}
    </select>
  </div>
</div>

<!-- Items Table -->
<div class="card">
  <div style="font-size:11px;letter-spacing:2px;color:#888;margin-bottom:16px;">품목 입력</div>
  <table id="itemsTable">
    <thead>
      <tr>
        <th style="width:35%">품 명</th>
        <th style="width:15%">수 량</th>
        <th style="width:15%">박 스</th>
        <th style="width:17%">단 가</th>
        <th style="width:15%">금 액</th>
        <th style="width:3%"></th>
      </tr>
    </thead>
    <tbody id="itemsBody">
      <tr class="item-row">
        <td><input type="text" name="product_name[]" placeholder="품명" style="width:100%;border:none;outline:none;font-size:13px;padding:2px;"></td>
        <td><input type="number" name="quantity[]" placeholder="0" class="qty" style="width:100%;border:none;outline:none;font-size:13px;padding:2px;text-align:right;"></td>
        <td><input type="number" name="boxes[]" placeholder="0" class="boxes-input" style="width:100%;border:none;outline:none;font-size:13px;padding:2px;text-align:right;"></td>
        <td><input type="number" name="unit_price[]" placeholder="0" class="price" style="width:100%;border:none;outline:none;font-size:13px;padding:2px;text-align:right;"></td>
        <td class="amount-display" style="text-align:right;font-weight:600;">0</td>
        <td><button type="button" class="remove-row" style="background:none;border:none;cursor:pointer;color:#aaa;font-size:16px;">×</button></td>
      </tr>
    </tbody>
  </table>
  <button type="button" id="addRow" class="btn btn-outline btn-sm" style="margin-top:12px;">+ 품목 추가</button>
</div>

<!-- Summary -->
<div class="card">
  <div style="max-width:400px;margin-left:auto;">

    <div id="deliveryRow" style="display:none;" class="form-group">
      <label>택배료</label>
      <input type="number" name="delivery_fee" id="delivery_fee" value="0" min="0">
    </div>

    <div id="deductionRow" style="display:none;" class="form-group">
      <label>공 제</label>
      <input type="number" name="deduction" id="deduction" value="0" min="0">
    </div>

    <div class="form-group">
      <label>입 금</label>
      <input type="number" name="payment_received" id="payment_received" value="0" min="0">
    </div>

    <div style="border-top:1px solid #ddd;padding-top:16px;margin-top:8px;">
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;">
        <span style="color:#888;letter-spacing:1px;">전 잔 액</span>
        <span id="prevBalanceDisplay" style="font-weight:500;">0 원</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:15px;border-top:2px solid #111;margin-top:4px;">
        <span style="letter-spacing:2px;font-weight:600;">현 잔 액</span>
        <span id="currentBalanceDisplay" style="font-weight:700;font-size:17px;">0 원</span>
      </div>
    </div>
  </div>
</div>

<div style="display:flex;justify-content:flex-end;gap:12px;">
  <a href="{% url 'dashboard' %}" class="btn btn-outline">취소</a>
  <button type="submit" class="btn btn-black">저 장</button>
</div>

</form>

<script>
let prevBalance = 0;

// Load previous balance when buyer changes
document.getElementById('buyerSelect').addEventListener('change', function() {
  const pk = this.value;
  const opt = this.options[this.selectedIndex];
  if (!pk) return;

  // Show/hide delivery fee and deduction rows
  const hasDelivery = opt.dataset.delivery === 'true';
  const hasDeduction = opt.dataset.deduction === 'true';
  document.getElementById('deliveryRow').style.display = hasDelivery ? 'block' : 'none';
  document.getElementById('deductionRow').style.display = hasDeduction ? 'block' : 'none';

  // Fetch previous balance
  fetch(`/api/buyer/${pk}/balance/`)
    .then(r => r.json())
    .then(data => {
      prevBalance = data.previous_balance;
      document.getElementById('prevBalanceDisplay').textContent = prevBalance.toLocaleString() + ' 원';
      recalculate();
    });
});

// Trigger on page load if buyer pre-selected
window.addEventListener('load', function() {
  const sel = document.getElementById('buyerSelect');
  if (sel.value) sel.dispatchEvent(new Event('change'));
});

// Add row
document.getElementById('addRow').addEventListener('click', function() {
  const tbody = document.getElementById('itemsBody');
  const newRow = tbody.querySelector('.item-row').cloneNode(true);
  newRow.querySelectorAll('input').forEach(i => i.value = '');
  newRow.querySelector('.amount-display').textContent = '0';
  tbody.appendChild(newRow);
  attachRowListeners(newRow);
});

// Remove row
function attachRowListeners(row) {
  row.querySelector('.remove-row').addEventListener('click', function() {
    const tbody = document.getElementById('itemsBody');
    if (tbody.querySelectorAll('.item-row').length > 1) {
      row.remove();
      recalculate();
    }
  });
  row.querySelector('.qty').addEventListener('input', function() { updateRowAmount(row); });
  row.querySelector('.boxes-input').addEventListener('input', function() { updateRowAmount(row); });
  row.querySelector('.price').addEventListener('input', function() { updateRowAmount(row); });
}

function updateRowAmount(row) {
  const qty   = parseFloat(row.querySelector('.qty').value) || 0;
  const boxes = parseFloat(row.querySelector('.boxes-input').value) || 0;
  const price = parseFloat(row.querySelector('.price').value) || 0;
  const amount = qty * boxes * price;
  row.querySelector('.amount-display').textContent = amount.toLocaleString();
  recalculate();
}

function recalculate() {
  let total = 0;
  document.querySelectorAll('.item-row').forEach(row => {
    const qty   = parseFloat(row.querySelector('.qty').value) || 0;
    const boxes = parseFloat(row.querySelector('.boxes-input').value) || 0;
    const price = parseFloat(row.querySelector('.price').value) || 0;
    total += qty * boxes * price;
  });
  const delivery = parseFloat(document.getElementById('delivery_fee').value) || 0;
  const deduction = parseFloat(document.getElementById('deduction').value) || 0;
  const payment = parseFloat(document.getElementById('payment_received').value) || 0;
  const current = total + delivery - deduction - payment + prevBalance;
  document.getElementById('currentBalanceDisplay').textContent = current.toLocaleString() + ' 원';
}

// Attach listeners to existing rows
document.querySelectorAll('.item-row').forEach(attachRowListeners);

// Recalculate on summary input change
['delivery_fee','deduction','payment_received'].forEach(id => {
  document.getElementById(id).addEventListener('input', recalculate);
});
</script>
{% endblock %}
