{% extends 'base.html' %}
{% block title %}계산서 삭제{% endblock %}
{% block content %}
<div class="page-header">
  <h1>계 산 서 삭 제</h1>
</div>
<div class="card" style="max-width:440px;">
  <p style="font-size:15px;margin-bottom:20px;">
    <strong>{{ invoice.buyer.name }}</strong> — {{ invoice.date }} 계산서를 삭제하시겠습니까?<br>
    <span style="color:#c0392b;font-size:13px;">이 작업은 되돌릴 수 없습니다.</span>
  </p>
  <form method="post" style="display:flex;gap:10px;">
    {% csrf_token %}
    <a href="{% url 'invoice_detail' invoice.pk %}" class="btn btn-outline">취소</a>
    <button type="submit" class="btn btn-danger">삭제 확인</button>
  </form>
</div>
{% endblock %}
