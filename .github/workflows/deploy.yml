name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to the VPS
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://inv.mtirop.com

    steps:
      - name: Check the deploy secrets are set
        run: |
          for name in SSH_HOST SSH_USER SSH_KEY; do
            [ -n "${!name}" ] || { echo "Missing secret $name"; exit 1; }
          done
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: Update the server and run deploy/deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /home/deploy/sites/invoice
            git fetch origin main
            git reset --hard origin/main
            bash deploy/deploy.sh

      - name: Smoke test the public site
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://inv.mtirop.com/)
            echo "Attempt $i -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "Site did not return 200 after deploy"; exit 1
